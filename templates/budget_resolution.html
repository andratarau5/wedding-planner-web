{% extends 'layout.html' %}
{% block content %}
<div class="content-box">
  <h2>📊 Budget Resolution</h2>

  <table>
    <tr>
      <td><strong>Total Gifts Received:</strong></td>
      <td>${{ total_gifts }}</td>
    </tr>
    <tr>
      <td><strong>Total Services:</strong></td>
      <td>${{ service_total }}</td>
    </tr>
    <tr>
      <td><strong>Total Other Expenses:</strong></td>
      <td>${{ other_total }}</td>
    </tr>
    <tr>
      <td><strong>Total Spent:</strong></td>
      <td>${{ total_spent }}</td>
    </tr>
    <tr>
      <td><strong>Remaining Balance:</strong></td>
      <td><strong style="color: {{ 'green' if remaining_balance >= 0 else 'red' }};">
        ${{ remaining_balance }}
      </strong></td>
    </tr>
  </table>

  <a href="{{ url_for('home') }}">⬅ Back to Home</a>
</div>
{% endblock %}
