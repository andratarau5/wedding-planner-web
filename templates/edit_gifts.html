{% extends 'layout.html' %}
{% block content %}
<div class="content-box">
  <h2>🎁 Guest Gift Tracker</h2>
  <form method="post">
    <table>
      <tr>
        <th>Guest Name</th>
        <th>Gift Amount (€)</th>
      </tr>
      {% for guest in guests %}
      <tr>
        <td>{{ guest.name }}</td>
        <td>
          <input type="number" step="0.01" name="gift_{{ loop.index0 }}" value="{{ guest.gift_amount or 0 }}">
        </td>
      </tr>
      {% endfor %}
    </table>
    <button type="submit">Save Gift Info</button>
  </form>

  <h3>Total Received: €{{ total_gifts }}</h3>
  <a href="{{ url_for('home') }}">⬅ Back to Home</a>
</div>
{% endblock %}
