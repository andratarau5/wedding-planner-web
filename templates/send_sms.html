{% extends 'layout.html' %}
{% block content %}
  <h2>Send SMS to {{ guest.name }}</h2>
  <form method="post">
    <label for="message">Message:</label><br>
    <textarea name="message" id="message" rows="5" cols="40"></textarea><br>
    <button type="submit">Send SMS</button>
  </form>
  <a href="{{ url_for('index') }}">Back to Guest List</a>
{% endblock %}
